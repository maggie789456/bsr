<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>市场需求款式集合</title>
<style>
  :root{
    --paper:#f4f1ea;
    --card:#fffdf9;
    --ink:#14161a;
    --ink-2:#4a4b50;
    --line:#dcd6c8;
    --accent:#c0442b;
    --accent-soft:#f0dcd5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 15% -10%, #fff 0%, transparent 55%),
      radial-gradient(circle at 95% 0%, #efe9dc 0%, transparent 45%);
    background-attachment:fixed;
  }
  ::selection{background:var(--accent);color:#fff}

  /* ---------- header ---------- */
  header{
    padding:56px 32px 26px;
    max-width:1420px;margin:0 auto;
  }
  .kicker{
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:18px;
    display:flex;align-items:center;gap:12px;
  }
  .kicker::after{content:"";height:1px;flex:1;background:var(--line)}
  h1{
    font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    font-size:clamp(34px,5.4vw,66px);
    line-height:1.02;margin:0;font-weight:600;letter-spacing:-.02em;
  }
  h1 em{font-style:italic;color:var(--accent)}
  .sub{
    margin-top:18px;max-width:640px;color:var(--ink-2);
    font-size:14px;line-height:1.85;
  }
  .toolbar{
    margin-top:30px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .count{
    font-family:"Songti SC",Georgia,serif;font-size:15px;letter-spacing:.04em;
  }
  .count b{font-size:26px;color:var(--accent);margin:0 4px;font-weight:600}
  .spacer{flex:1}
  .find{
    display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink);
    padding:4px 2px;min-width:230px;
  }
  .find span{font-size:12px;letter-spacing:.18em;color:var(--ink-2)}
  .find input{
    border:0;background:transparent;outline:none;font-size:14px;color:var(--ink);
    font-family:inherit;padding:4px 0;width:100%;
  }

  /* ---------- grid ---------- */
  main{max-width:1420px;margin:0 auto;padding:34px 32px 20px}
  .grid{
    display:grid;gap:26px;
    grid-template-columns:repeat(auto-fill,minmax(268px,1fr));
  }
  .card{
    background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;
    opacity:0;transform:translateY(14px);
    transition:opacity .5s ease,transform .5s ease,box-shadow .3s ease,border-color .3s ease;
  }
  .card.in{opacity:1;transform:none}
  .card:hover{box-shadow:0 18px 40px -22px rgba(20,22,26,.45);border-color:#c9c1b1}
  .media{
    position:relative;aspect-ratio:3/4;overflow:hidden;background:#eae5da;cursor:zoom-in;
  }
  .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.22,.61,.36,1)}
  .card:hover .media img{transform:scale(1.035)}
  .no{
    position:absolute;top:10px;left:10px;z-index:2;
    font-size:10px;letter-spacing:.14em;font-variant-numeric:tabular-nums;
    background:rgba(20,22,26,.78);color:#fff;padding:3px 7px;
  }
  .ar{
    position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:30px;height:30px;border:0;border-radius:50%;
    background:rgba(255,253,249,.92);color:var(--ink);
    font-size:17px;line-height:1;cursor:pointer;opacity:0;transition:opacity .25s, background .2s;
    display:grid;place-items:center;padding-bottom:2px;
  }
  .ar.l{left:8px}.ar.r{right:8px}
  .media:hover .ar{opacity:1}
  .ar:hover{background:#fff;color:var(--accent)}
  .dots{position:absolute;bottom:9px;left:0;right:0;display:flex;gap:5px;justify-content:center;z-index:2}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);transition:.25s}
  .dots i.on{background:#fff;width:14px;border-radius:3px}

  .body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .idrow{display:flex;align-items:center;gap:8px}
  .lbl{font-size:10px;letter-spacing:.16em;color:var(--ink-2);white-space:nowrap}
  .idv{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px;background:#f2eee4;padding:3px 6px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
  }
  .copy{
    border:1px solid var(--ink);background:transparent;color:var(--ink);
    font-size:11px;padding:4px 9px;cursor:pointer;font-family:inherit;letter-spacing:.06em;
    transition:.2s;white-space:nowrap;
  }
  .copy:hover{background:var(--ink);color:#fff}
  .copy.ok{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{
    margin:0;font-size:11px;color:var(--accent);line-height:1.55;
    padding-left:10px;border-left:2px solid var(--accent-soft);
  }
  .paths{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
  .prow{display:flex;gap:7px;align-items:flex-start}
  .tag{
    font-size:9.5px;letter-spacing:.1em;background:#eee8da;color:var(--ink-2);
    padding:2px 5px;white-space:nowrap;margin-top:1px;
  }
  .ptext{
    margin:0;font-size:10.5px;line-height:1.6;color:var(--ink-2);flex:1;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .pcopy{
    border:0;background:transparent;color:#9a9486;cursor:pointer;font-size:13px;
    padding:0 1px;line-height:1.3;transition:.2s;
  }
  .pcopy:hover{color:var(--accent)}
  .acts{display:flex;gap:8px;margin-top:auto;padding-top:4px;position:relative}
  .btn{
    flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;
    font-family:inherit;font-size:12.5px;letter-spacing:.08em;padding:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:.22s;
  }
  .btn b{font-weight:400;font-size:15px;line-height:1}
  .btn:hover{background:var(--accent);border-color:var(--accent)}
  .menu{
    position:absolute;right:0;bottom:calc(100% + 6px);background:#fff;border:1px solid var(--line);
    box-shadow:0 16px 34px -18px rgba(20,22,26,.5);display:none;flex-direction:column;min-width:150px;z-index:8;
  }
  .menu.show{display:flex}
  .menu a{
    padding:9px 12px;font-size:12px;color:var(--ink);text-decoration:none;
    border-bottom:1px solid #f0ece2;transition:.15s;
  }
  .menu a:last-child{border-bottom:0}
  .menu a:hover{background:#f6f2e8;color:var(--accent)}

  /* ---------- lightbox ---------- */
  .lb{
    position:fixed;inset:0;z-index:100;background:rgba(12,13,15,.95);
    display:none;align-items:center;justify-content:center;padding:4vh 4vw;
    backdrop-filter:blur(6px);
  }
  .lb.on{display:flex}
  .lb img{max-width:min(90vw,760px);max-height:84vh;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .lb .nav{
    position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;
    border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#fff;
    font-size:24px;cursor:pointer;display:grid;place-items:center;transition:.2s;
  }
  .lb .nav:hover{background:#fff;color:#111}
  .lb .prev{left:2.5vw}.lb .next{right:2.5vw}
  .lb .cap{
    position:absolute;bottom:3vh;left:0;right:0;text-align:center;color:#cfcabd;
    font-size:11.5px;letter-spacing:.18em;font-family:ui-monospace,Menlo,monospace;
  }
  .lb .x{
    position:absolute;top:3vh;right:3vw;background:transparent;border:1px solid rgba(255,255,255,.3);
    color:#fff;width:36px;height:36px;cursor:pointer;font-size:16px;transition:.2s;
  }
  .lb .x:hover{background:#fff;color:#111}

  /* ---------- footer ---------- */
  footer{max-width:1420px;margin:40px auto 0;padding:26px 32px 60px;border-top:1px solid var(--line)}
  .disc{
    border:1px solid var(--line);background:#fffdf7;padding:20px 22px;
  }
  .disc h3{
    margin:0 0 10px;font-size:12px;letter-spacing:.24em;color:var(--accent);font-weight:700;
  }
  .disc p{margin:0;font-size:12px;line-height:1.95;color:var(--ink-2)}
  .disc p + p{margin-top:6px}

  .toast{
    position:fixed;left:50%;bottom:38px;transform:translate(-50%,20px);
    background:var(--ink);color:#fff;font-size:12.5px;letter-spacing:.08em;
    padding:11px 20px;opacity:0;pointer-events:none;transition:.3s;z-index:200;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    header{padding:34px 18px 20px}
    main{padding:22px 18px 10px}
    .grid{gap:18px;grid-template-columns:repeat(2,1fr)}
    .body{padding:11px 11px 13px;gap:8px}
    .idv{font-size:10.5px}
    .copy{font-size:10px;padding:3px 6px}
    .ptext{font-size:9.5px}
    .btn{font-size:11.5px;padding:9px 4px}
    footer{padding:20px 18px 44px}
    .lb .nav{width:38px;height:38px;font-size:19px}
  }

  /* ---------- tabs ---------- */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .tab{
    border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:inherit;font-size:12.5px;letter-spacing:.06em;padding:8px 14px;cursor:pointer;
    transition:.2s;display:flex;align-items:center;gap:7px;
  }
  .tab b{font-weight:600;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
  .tab:hover{border-color:var(--ink);color:var(--ink)}
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .tab.on b{color:#fff}
  .empty{padding:60px 0;text-align:center;color:var(--ink-2);font-size:13px;letter-spacing:.1em}
  .ttl{
    margin:0;font-size:11.5px;line-height:1.6;color:var(--ink-2);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .badge{
    position:absolute;top:10px;right:10px;z-index:2;font-size:9.5px;letter-spacing:.1em;
    background:rgba(255,253,249,.9);color:var(--ink);padding:3px 7px;
  }
  .src{
    flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);
    font-family:inherit;font-size:12.5px;letter-spacing:.08em;padding:10px;cursor:pointer;
    text-align:center;text-decoration:none;transition:.22s;display:flex;align-items:center;justify-content:center;
  }
  .src:hover{border-color:var(--accent);color:var(--accent)}
  .meta-line{margin-top:12px;font-size:11.5px;color:#9a9486;letter-spacing:.04em}
</style>
</head>

/* ---------- render ---------- */
function each(list, fn){ for (var i = 0; i < list.length; i++) fn(list[i], i); }
const gridEl = document.getElementById('grid');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHTML(it, i){
  const k = i + 1;
  const no = (k < 10 ? '0' : '') + k;
  const imgs = it.imgs.length ? it.imgs : [''];
  const dots = imgs.map((_, k) => '<i class="' + (k === 0 ? 'on' : '') + '"></i>').join('');
  return ''
  + '<article class="card" data-id="' + esc(it.id) + '" data-leaf="' + esc(it.leaf) + '">'
  +   '<div class="media" data-len="' + imgs.length + '" data-cur="0">'
  +     '<span class="no">' + no + '</span>'
  +     (it.sites > 1 ? '<span class="badge">' + it.sites + ' 站点在售</span>' : '')
  +     '<img src="' + esc(imgs[0]) + '" alt="款式 ' + esc(it.id) + '" referrerpolicy="no-referrer" loading="lazy">'
  +     '<button class="ar l" aria-label="上一张">‹</button><button class="ar r" aria-label="下一张">›</button>'
  +     '<div class="dots">' + dots + '</div>'
  +   '</div>'
  +   '<div class="body">'
  +     '<div class="idrow">'
  +       '<span class="lbl">款式编号</span>'
  +       '<code class="idv">' + esc(it.id) + '</code>'
  +       '<button class="copy" data-copy="' + esc(it.id) + '">复制</button>'
  +     '</div>'
  +     '<p class="hint">复制款式编号发给【麦杞岐】跟款</p>'
  +     (it.title ? '<p class="ttl" title="' + esc(it.title) + '">' + esc(it.title) + '</p>' : '')
  +     '<div class="paths">'
  +       '<div class="prow">'
  +         '<span class="tag">' + esc(it.leaf) + '</span>'
  +         '<p class="ptext" title="' + esc(it.path) + '">' + esc(it.path) + '</p>'
  +         '<button class="pcopy" data-copy="' + esc(it.path) + '" title="复制类目路径">⧉</button>'
  +       '</div>'
  +     '</div>'
  +     '<div class="acts">'
  +       (it.link ? '<a class="src" href="' + esc(it.link) + '" target="_blank" rel="noopener">原款链接</a>' : '<button class="src" disabled>无原链</button>')
  +       '<button class="btn search"><span>搜索同款</span><b>⌕</b></button>'
  +       '<div class="menu">'
  +         '<a data-eng="lens" href="#">Google Lens</a>'
  +         '<a data-eng="baidu" href="#">百度识图</a>'
  +         '<a data-eng="yandex" href="#">Yandex Images</a>'
  +       '</div>'
  +     '</div>'
  +   '</div>'
  + '</article>';
}

gridEl.innerHTML = DATA.map(cardHTML).join('');

const leaves = [];
DATA.forEach(it => { if (leaves.indexOf(it.leaf) < 0) leaves.push(it.leaf); });
const tabsEl = document.getElementById('tabs');
const counts = {};
leaves.forEach(l => counts[l] = DATA.filter(x => x.leaf === l).length);
let activeLeaf = '全部';
tabsEl.innerHTML = ''

  + leaves.map(l => '<button class="tab" data-leaf="' + esc(l) + '">' + esc(l) + ' <b>' + counts[l] + '</b></button>').join('');

document.getElementById('metaLine').textContent =
  '数据来源：市场需求款表格 · ' + DATA.length + ' 款款式 / ' + DATA.reduce((a, b) => a + b.rows, 0) + ' 条任务记录';

/* ---------- copy ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(() => t.classList.remove('on'), 1500);
}
function copyText(str){
  const done = () => toast('已复制');
  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(str).then(done).catch(() => fallback(str, done));
  } else { fallback(str, done); }
}
function fallback(str, done){
  const ta = document.createElement('textarea');
  ta.value = str;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败，请长按选择'); }
  document.body.removeChild(ta);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b){
    copyText(b.dataset.copy);
    if (b.classList.contains('copy')){
      b.classList.add('ok');
      const o = b.textContent;
      b.textContent = '已复制';
      setTimeout(() => { b.classList.remove('ok'); b.textContent = o; }, 1300);
    }
    return;
  }
});

/* ---------- carousel ---------- */
function render(media, cur){
  const item = DATA.find(d => d.id === media.closest('.card').dataset.id);
  media.dataset.cur = cur;
  media.querySelector('img').src = item.imgs[cur];
  each(media.querySelectorAll('.dots i'), (d, k) => d.classList.toggle('on', k === cur));
}
gridEl.addEventListener('click', e => {
  const ar = e.target.closest('.ar');
  const media = e.target.closest('.media');
  if (!media) return;
  if (e.target.tagName === 'IMG'){ openLB(media.closest('.card').dataset.id, +media.dataset.cur); return; }
  const item = DATA.find(d => d.id === media.closest('.card').dataset.id);
  const len = item.imgs.length;
  if (ar && len > 1){
    e.stopPropagation();
    const cur = (+media.dataset.cur + (ar.classList.contains('l') ? -1 : 1) + len) % len;
    render(media, cur);
  }
});

/* ---------- lightbox ---------- */
let lbState = null;
function openLB(id, i){
  const item = DATA.find(d => d.id === id);
  if (!item || !item.imgs.length) return;
  lbState = {item, i};
  paint();
  document.getElementById('lb').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function paint(){
  const s = lbState;
  document.getElementById('lbimg').src = s.item.imgs[s.i];
  document.getElementById('lbcap').textContent = '款式编号 ' + s.item.id + '   ·   ' + (s.i + 1) + ' / ' + s.item.imgs.length;
  const multi = s.item.imgs.length > 1;
  document.getElementById('lbp').style.display = multi ? 'grid' : 'none';
  document.getElementById('lbn').style.display = multi ? 'grid' : 'none';
}
function closeLB(){
  document.getElementById('lb').classList.remove('on');
  document.body.style.overflow = '';
  lbState = null;
}
document.getElementById('lbx').onclick = closeLB;
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLB(); });
document.getElementById('lbp').onclick = () => { if (!lbState) return; lbState.i = (lbState.i - 1 + lbState.item.imgs.length) % lbState.item.imgs.length; paint(); };
document.getElementById('lbn').onclick = () => { if (!lbState) return; lbState.i = (lbState.i + 1) % lbState.item.imgs.length; paint(); };
document.addEventListener('keydown', e => {
  if (!lbState) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') document.getElementById('lbp').click();
  if (e.key === 'ArrowRight') document.getElementById('lbn').click();
});

/* ---------- search same style ---------- */
const ENGINES = {
  lens:   u => 'https://lens.google.com/uploadbyurl?url=' + encodeURIComponent(u),
  baidu:  u => 'https://graph.baidu.com/details?isfromtusoupc=1&tn=pc&carousel=0&image=' + encodeURIComponent(u),
  yandex: u => 'https://yandex.com/images/search?rpt=imageview&url=' + encodeURIComponent(u)
};
document.addEventListener('click', e => {
  const sb = e.target.closest('.search');
  const link = e.target.closest('.menu a');
  each(document.querySelectorAll('.menu'), m => { if (!sb || m !== sb.parentElement.querySelector('.menu')) m.classList.remove('show'); });
  if (sb){
    const menu = sb.parentElement.querySelector('.menu');
    const card = sb.closest('.card');
    const media = card.querySelector('.media');
    const item = DATA.find(d => d.id === card.dataset.id);
    const url = item.imgs[+media.dataset.cur];
    if (!url){ toast('暂无图片'); return; }
    each(menu.querySelectorAll('a'), a => {
      a.href = ENGINES[a.dataset.eng](url);
      a.target = '_blank';
      a.rel = 'noopener';
    });
    menu.classList.toggle('show');
    return;
  }
  if (link) link.parentElement.classList.remove('show');
});

/* ---------- filter ---------- */
const qEl = document.getElementById('q');
function applyFilter(){
  const v = qEl.value.trim().toLowerCase();
  let n = 0;
  each(document.querySelectorAll('.card'), c => {
    const okLeaf = activeLeaf === '全部' || c.dataset.leaf === activeLeaf;
    const t = c.querySelector('.ttl');
    const txt = (c.dataset.id + ' ' + (t ? t.textContent : '')).toLowerCase();
    const hit = okLeaf && (!v || txt.indexOf(v) >= 0);
    c.style.display = hit ? '' : 'none';
    if (hit) n++;
  });
  document.getElementById('cnt').textContent = n;
  document.getElementById('empty').style.display = n ? 'none' : '';
}
tabsEl.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  activeLeaf = t.dataset.leaf;
  each(tabsEl.querySelectorAll('.tab'), x => x.classList.toggle('on', x === t));
  applyFilter();
});
qEl.addEventListener('input', applyFilter);
applyFilter();

/* ---------- reveal ---------- */
if (typeof IntersectionObserver === 'function'){
  const io = new IntersectionObserver(es => {
    each(es, en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  }, {rootMargin: '0px 0px -8% 0px'});
  each(document.querySelectorAll('.card'), (c, i) => {
    c.style.transitionDelay = (i % 8) * 40 + 'ms';
    io.observe(c);
  });
  setTimeout(() => each(document.querySelectorAll('.card'), c => c.classList.add('in')), 1800);
} else {
  each(document.querySelectorAll('.card'), c => c.classList.add('in'));
}

/* ---------- image fail ---------- */
document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName === 'IMG' && !img.dataset.failed){
    img.dataset.failed = 1;
    img.style.display = 'none';
    const p = document.createElement('div');
    p.style.cssText = 'width:100%;height:100%;display:grid;place-items:center;color:#9a9486;font-size:12px;letter-spacing:.1em;background:#efeadd';
    p.textContent = '图片加载失败（需联网）';
    img.parentElement.insertBefore(p, img);
  }
}, true);
</script>
